name: Deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Stopp hvis noe internt er med
        # Siden er åpen for alle med URL-en. .github publiseres ikke, så mønsteret kan stå her.
        run: |
          m='fremra ?lab|onmicrosoft\.com|[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}|\b[0-9]{16}\b|\bNGD\b'
          if grep -rIniE --exclude-dir=.git --exclude-dir=.github "$m" .; then
            echo "::error::Fant tekst som ikke skal publiseres (linjene over)."
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
